name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SpatiaLite (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libspatialite-dev

      - name: Install SpatiaLite (Windows)
        if: runner.os == 'Windows'
        run: |
          # SpatiaLite binaries for Windows CI
          # Download from gaia-gis.it and set SPATIALITE_DIR
          echo "SPATIALITE_DIR=${{ github.workspace }}\spatialite" >> $env:GITHUB_ENV

      - name: Install package
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest -v
        env:
          # Set to test data path if available, otherwise tests skip gracefully
          GPKG_TEST_DATA: ""
