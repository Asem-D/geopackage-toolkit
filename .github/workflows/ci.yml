name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SpatiaLite (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-mod-spatialite libspatialite-dev

      - name: Install SpatiaLite (Windows)
        if: runner.os == 'Windows'
        run: |
          # Download SpatiaLite binaries for Windows CI
          $url = "https://www.gaia-gis.it/gaia-sins/windows-bin-amd64/mod_spatialite-5.1.0-win-amd64.7z"
          $spatialiteDir = "${{ github.workspace }}\spatialite"
          New-Item -ItemType Directory -Force -Path $spatialiteDir
          $archive = "$spatialiteDir\spatialite.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          7z x $archive -o"$spatialiteDir" -y
          # Archive extracts to a subdirectory; flatten it
          $subdir = Get-ChildItem -Path $spatialiteDir -Directory | Select-Object -First 1
          if ($subdir) { Move-Item "$($subdir.FullName)\*" $spatialiteDir -Force }
          echo "SPATIALITE_DIR=$spatialiteDir" >> $env:GITHUB_ENV

      - name: Install package
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest -v
        env:
          # Set to test data path if available, otherwise tests skip gracefully
          GPKG_TEST_DATA: ""
